# ============================================================
# Nginx reverse proxy template for decave-server (Node/Express, PM2)
# ------------------------------------------------------------
# 1. Replace api.yourdomain.com with your real domain.
# 2. Place this file at /etc/nginx/sites-available/decave-server
# 3. Symlink it: ln -s /etc/nginx/sites-available/decave-server /etc/nginx/sites-enabled/
# 4. Test config: nginx -t
# 5. Reload: systemctl reload nginx
# 6. Issue SSL with certbot: certbot --nginx -d api.yourdomain.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.decavemgt.com;

    # This is the setting that silently caps uploads if left at the
    # Nginx default (1MB) — it must be >= whatever MAX_FILE_SIZE is
    # set to in the app's .env, or large uploads will fail at the
    # proxy before ever reaching Node.
    client_max_body_size 20M;

    # Generous timeouts — ticket purchase / PDF generation / email
    # sending can take a few seconds; don't let Nginx cut it short.
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Express's `app.set('trust proxy', 1)` to correctly
        # read the real client IP (used by the rate limiter).
        proxy_set_header Connection "";

        proxy_redirect off;
        proxy_buffering off;
    }

    # Optional: serve /public (e.g. decave-logo.png) straight from disk
    # instead of round-tripping through Node, if you want the small
    # static-asset win. Safe to delete this block if not needed.
    location /public/ {
        alias /var/www/decave-server/public/;
        expires 7d;
        access_log off;
    }
}

# ------------------------------------------------------------
# After certbot runs, it will add a second `server { listen 443 ssl; }`
# block above (or rewrite this one) and an HTTP -> HTTPS redirect.
# Re-check `client_max_body_size` is still present in that block too —
# certbot sometimes generates a fresh server block that won't inherit it.
# ------------------------------------------------------------